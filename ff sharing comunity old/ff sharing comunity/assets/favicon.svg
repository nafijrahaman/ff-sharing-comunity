<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="ffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="50%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Shape -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#ffGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Flame / Crosshair Gaming Elements -->
  <g filter="url(#glow)">
    <!-- Crosshair Target Rings -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#iceGrad)" stroke-width="6" opacity="0.3" stroke-dasharray="16 8"/>
    <circle cx="256" cy="256" r="80" fill="none" stroke="url(#ffGrad)" stroke-width="4" opacity="0.5"/>
    
    <!-- Crosshair Axis Lines -->
    <line x1="256" y1="80" x2="256" y2="140" stroke="#ff7700" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="372" x2="256" y2="432" stroke="#ff7700" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="256" x2="140" y2="256" stroke="#ff7700" stroke-width="6" stroke-linecap="round"/>
    <line x1="372" y1="256" x2="432" y2="256" stroke="#ff7700" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Stylized "FF" Text / Emblem -->
  <text x="256" y="295" 
        font-family="'Outfit', 'Impact', sans-serif" 
        font-size="160" 
        font-weight="900" 
        text-anchor="middle" 
        fill="url(#ffGrad)"
        letter-spacing="2">FF</text>

  <!-- Ice Accent Dot -->
  <circle cx="340" cy="180" r="12" fill="#38bdf8" filter="url(#glow)"/>
</svg>
